name: Release Installer (NSIS)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # El host de windows-latest es msvc y el target es gnu. rustc YA usa `gcc` por defecto
  # para `x86_64-pc-windows-gnu`, asi que esto no arregla nada por si solo: es una cincha
  # para que el enlazador no dependa de como se llame el primer gcc que aparezca en el PATH
  # (la imagen del runner trae mas de uno: el de `C:\ProgramData\mingw64` y el de MSYS2).
  # Un valor sin ruta es a proposito: se resuelve en el PATH, que es lo que fija el paso de
  # MinGW de abajo. Poner aqui una ruta absoluta la dejaria fija para el develop local, donde
  # el toolchain vive en otro sitio.
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc

jobs:
  build-and-release:
    name: Build & Package (Windows x64 GNU)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust (x86_64-pc-windows-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      # El host de windows-latest es msvc, asi que compilar para gnu es un CRUZADO: rustup
      # trae el std de gnu, pero el enlazador (gcc) y las DLL de las que depende vienen del
      # toolchain de MinGW y no son los de MSVC. El proyecto ya depende de ese toolchain en
      # local (AGENTS.md: MinGW GCC 16.2), asi que se instala el mismo aqui en vez de
      # confiar en lo que traiga la imagen del runner, que cambia sin avisar.
      #
      # Chocolatey NO deja los binarios en su propio `bin`: el paquete `mingw` desempaqueta
      # el toolchain en `C:\ProgramData\mingw64\mingw64\bin`. Por eso el `Test-Path` contra
      # `chocolatey\bin\gcc.exe` fallaba aunque la instalacion fuese correcta: ese shim no
      # existe en todas las versiones del paquete.
      #
      # `upgrade`, NO `install`. El paquete `mingw` tiene 32 versiones publicadas y la ultima
      # es la 16.1.0, pero `choco install` sobre un paquete YA INSTALADO no actualiza nada:
      # responde "already installed" y se deja la version que traia la imagen. La imagen de
      # windows-latest trae una gcc mucho mas antigua, y `upgrade` si trae la moderna.
      # `upgrade` es idempotente -si ya esta al dia no hace nada y no falla-, a diferencia de
      # `install --force`, que rehace la instalacion entera en cada ejecucion.
      #
      # La ruta va a `GITHUB_PATH`, que es lo que hace que `cargo` y `tauri build` la vean en
      # los pasos SIGUIENTES: cambiar `$env:PATH` dentro del `run` solo afecta a este proceso.
      # `src-tauri/.cargo/config.toml` no fija `linker`, asi que el target gnu toma el `gcc`
      # que encuentre en el PATH, y las DLL de las que dependen los binarios generados
      # (`libgcc_s_seh-1.dll`, `libstdc++-6.dll`, ...) salen del mismo directorio.
      # `-Encoding utf8` sin BOM porque `shell: pwsh` es PowerShell 7; en Windows PowerShell
      # 5.1 ese mismo valor escribe BOM y la primera entrada de GITHUB_PATH quedaria con un
      # `FEFF` delante. Si este paso cambia de shell, el encoding hay que cambiar con el.
      - name: Setup MinGW (GCC for x86_64-pc-windows-gnu)
        shell: pwsh
        run: |
          choco upgrade mingw --no-progress -y
          Write-Host "choco upgrade mingw devolvio $LASTEXITCODE (0 tambien cuando ya estaba al dia)"

          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"
          # `$gccDir` es el directorio que de verdad acabo en el PATH. Se lleva por separado
          # porque el mensaje de error tiene que nombrar ESE, no `$mingwBin`: si el fallo viene
          # del fallback, decir "no se ejecuta desde C:\ProgramData\mingw64..." manda a mirar
          # una ruta que no es la que se uso.
          if (Test-Path "$mingwBin\gcc.exe") {
            $gccDir = $mingwBin
            Write-Host "MinGW encontrado en $gccDir. Anadiendo a GITHUB_PATH..."
            $gccDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$gccDir;$env:PATH"
          } else {
            # Fallback en caso de que cambie la estructura de extraccion
            $fallback = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\mingw" -Filter "gcc.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($fallback) {
              $gccDir = $fallback.DirectoryName
              Write-Host "MinGW encontrado por busqueda en $gccDir. Anadiendo a GITHUB_PATH..."
              $gccDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "$gccDir;$env:PATH"
            } else {
              Write-Error "No se pudo localizar gcc.exe ni en $mingwBin ni bajo C:\ProgramData\chocolatey\lib\mingw tras la instalacion de MinGW"
              exit 1
            }
          }

          # Verificacion directa ejecutando el compilador: un `Test-Path` rigido contra una
          # ruta que el paquete puede cambiar es el fallo que se acaba de corregir. Lo que
          # importa es que `gcc` CORRA, y que corra el que se acaba de poner en el PATH.
          & gcc --version
          if ($LASTEXITCODE -ne 0) { throw "gcc no se ejecuta desde el PATH ($gccDir)" }

          # Y ademas que sea MODERNO. Sin esta comprobacion, una gcc de 8.x que `choco upgrade`
          # no llega a tocar se lleva el fallo cinco minutos mas adelante, dentro del linkado,
          # con un mensaje que no menciona la version. Aqui se ve al instante y con nombre.
          # El 13 es el minimo que se ha visto compilar este grafo; el 16.1.0 es lo que instala
          # el paquete.
          $gccVer = (& gcc -dumpfullversion 2>&1 | Select-Object -First 1)
          if ("$gccVer" -notmatch '^\s*(\d+)') {
            Write-Error "No se pudo leer la version de gcc desde $gccDir (devolvio '$gccVer')"
            exit 1
          }
          if ([int]$Matches[1] -lt 13) {
            Write-Error "gcc $gccVer en $gccDir es demasiado antiguo para x86_64-pc-windows-gnu con este grafo de dependencias"
            exit 1
          }
          Write-Host "gcc verificado: $gccVer en $gccDir"

      # Arregla el fallo que tumbo las ejecuciones 2 a 5. `embed-resource` (via `tauri-build`)
      # elige su compilador de recursos con un `#[cfg(target_env = "msvc")]`, o sea por el
      # HOST con el que se compilo el crate, no por el target. El runner tiene host MSVC, asi
      # que usa `rc.exe`, nombra la salida `resource.lib` y le mete formato de recursos de
      # Microsoft; el `ld` de GNU lo rechaza con `file format not recognized` y muere el
      # enlazado. En local no pasa porque el host es GNU y ahi entra por la rama `windres`.
      # `scripts/rc-shim.c` traduce los argumentos estilo MSVC a windres y devuelve COFF, que
      # es lo que `ld` si sabe leer. Se exporta en `RC`, que es la variable que esa rama
      # respeta.
      - name: Build rc-shim (resource compiler bridge for GNU cross builds)
        shell: pwsh
        run: |
          $shim = Join-Path $env:RUNNER_TEMP "rc-shim.exe"
          & gcc -O2 -o $shim scripts/rc-shim.c
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $shim)) {
            throw "no se pudo compilar scripts/rc-shim.c"
          }

          # Prueba de humo, y con la cabecera comprobada: si el shim produjese algo que no es
          # COFF, el fallo no se veria hasta el enlazado de tauri, diez minutos despues y con
          # el mismo mensaje opaco que se acaba de diagnosticar. Aqui se ve en un segundo.
          $rc = Join-Path $env:RUNNER_TEMP "rc-shim-smoke.rc"
          $obj = Join-Path $env:RUNNER_TEMP "rc-shim-smoke.lib"
          Set-Content -Path $rc -Value '1 ICON "icon.ico"' -Encoding ascii
          & $shim /fo $obj /I "src-tauri/icons" $rc
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $obj)) {
            throw "el shim no compilo el .rc de prueba"
          }
          $cabecera = [System.IO.File]::ReadAllBytes($obj)[0..1]
          if ($cabecera[0] -ne 0x64 -or $cabecera[1] -ne 0x86) {
            throw ("el shim no produjo un COFF x86_64 (cabecera {0:X2}{1:X2})" -f $cabecera[0], $cabecera[1])
          }

          "RC=$shim" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "rc-shim verificado en $shim y exportado como RC"

      # Tauri v2 NO usa el NSIS del sistema: descarga el suyo a `%LOCALAPPDATA%\tauri\NSIS`
      # y empaqueta con ese. Este paso existe para que el log diga QUE NSIS hay y de donde
      # sale, no para arreglar nada: cuando el fallo esta en el empaquetado, la version del
      # NSIS en uso es la primera pregunta y era imposible de contestar sin abrir el log
      # entero. Se instala solo si no hay ninguno, y su fallo NO para el build: `tauri` lleva
      # el suyo y un `choco install nsis` que devuelve codigo distinto de cero no debe tumbar
      # un empaquetado que iba a funcionar.
      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          # Donde Tauri guarda su NSIS. Se lista aunque este vacio: que el directorio NO
          # exista ya es informacion, porque significa que el CLI tendra que descargarlo en
          # el paso de empaquetado y ese es el punto donde se cae la red.
          $propio = Join-Path $env:LOCALAPPDATA "tauri\NSIS"
          if (Test-Path $propio) {
            Write-Host "NSIS propio de tauri en $propio :"
            Get-ChildItem $propio -Recurse -Filter "makensis.exe" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Host "aun no hay NSIS propio de tauri en $propio (se descargara al empaquetar)"
          }

          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "makensis del sistema: $((Get-Command makensis).Source)"
            & makensis -VERSION 2>&1 | ForEach-Object { Write-Host "  version: $_" }
          } else {
            Write-Host "makensis no esta en el PATH; instalando NSIS con Chocolatey..."
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              Write-Host "aviso: 'choco install nsis' devolvio $LASTEXITCODE. No es fatal: tauri usa el suyo."
            } else {
              Write-Host "NSIS instalado."
            }
          }

      # Solo se cachea el registro de crates, NO `src-tauri/target/`. El build de este
      # proyecto es de release y el perfil por defecto no lleva incremental
      # (`src-tauri/.cargo/config.toml`), asi que target/ no se puede reusar entre jobs:
      # guardarlo en la cache solo gasta cuota (el limite de la cache son 10 GB por repo) y
      # ralentiza cada guardado. Si alguna vez hace falta cachear compilados, la clave
      # tiene que distinguir release de debug, que es justo lo que no hacia esta.
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gnu-

      - name: Install Node dependencies
        run: npm ci

      - name: Deploy Whisper.cpp runtime DLLs
        shell: pwsh
        run: |
          # Con `-ExecutionPolicy Bypass -File` y no `./deploy-whisper.ps1`: la politica de
          # ejecucion por defecto de un runner de Windows puede denegar el script, y esa
          # forma es la que ya documenta AGENTS.md para ejecutarlo en local.
          powershell -ExecutionPolicy Bypass -File scripts\deploy-whisper.ps1
          if ($LASTEXITCODE -ne 0) { throw "deploy-whisper.ps1 fallo con codigo $LASTEXITCODE" }
          # La ruta lleva `crates/`: el runtime lo descarga deploy-whisper.ps1 a
          # `src-tauri\crates\lyricstream-whisper-sys\runtime\`, que es la misma ruta que
          # declara tauri.conf.json en bundle.resources. Sin `crates/` el paso revienta con
          # "No se encuentra la ruta de acceso" y el job muere antes de comparar el conteo.
          $runtime = "src-tauri/crates/lyricstream-whisper-sys/runtime"
          $dllCount = @(Get-ChildItem -Path "$runtime/*.dll" -ErrorAction Stop).Count
          Write-Host "DLLs de Whisper desplegadas en ${runtime}: $dllCount"
          # 12 es el numero real que descarga el script. El umbral de 5 es deliberadamente
          # bajo: lo que se quiere es pillar una descarga a medias, no afirmar una version.
          if ($dllCount -lt 5) {
            Write-Error "Faltan binarios de whisper.cpp en $runtime (solo hay $dllCount)"
            exit 1
          }

      - name: Build Next.js Static Export
        run: npm run build

      # `--bundles nsis` explicito: `tauri.conf.json` pone `"targets": "all"`, asi que
      # sin esto el runner construye tambien el MSI, que ni se inspecciona ni se publica
      # y aqui es el paso mas caro (el linkado con poco paralelismo).
      #
      # `--verbose` y el volcado a `tauri-build.log` van a proposito, por un motivo
      # concreto: la API de GitHub exige autenticacion para bajar los logs de un job (403
      # sin token), asi que hasta ahora el unico dato que hubo fue "failed" sin saber por
      # que. El artefacto de debajo deja el error legible aunque la API no responda.
      #
      # Las dos lineas de `$ErrorActionPreference` NO son ruido. GitHub antepone
      # `$ErrorActionPreference = 'stop'` a los pasos `pwsh`, y desde PowerShell 7.3
      # `$PSNativeCommandUseErrorActionPreference` puede convertir un comando nativo con
      # salida distinta de cero en error TERMINANTE. Si eso ocurre aqui, la excepcion salta
      # en la tuberia, `$LASTEXITCODE` no llega a leerse y el paso muere con el texto de
      # PowerShell en vez de con el codigo real de `tauri`: el diagnostico que se pretendia
      # guardar se pierde justo en el caso para el que existe. Se desactivan las dos cosas
      # unicamente alrededor de la llamada; el resto del paso sigue con `stop`.
      - name: Build Tauri NSIS Package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $log = "tauri-build.log"
          $ErrorActionPreference = "Continue"
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          & npm run tauri build -- --target x86_64-pc-windows-gnu --bundles nsis --verbose *>&1 |
            Tee-Object -FilePath $log

          # En una instruccion aparte a proposito: `Tee-Object` es un cmdlet y no toca
          # `$LASTEXITCODE`, asi que justo despues de la tuberia el valor sigue siendo el
          # del ultimo comando NATIVO, que es `npm`.
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # El log se publica por DOS canales, y no por capricho. Descargar el artefacto
            # exige token (401 en repo publico) y la API de logs tambien (403), asi que sin
            # esto un fallo de CI no deja ni un error legible en ningun sitio. Las
            # anotaciones se leen sin autenticar en `/check-runs/{id}/annotations`, y el
            # resumen se renderiza en la pagina del run. Ademas son lo primero que ve quien
            # abre el run en el navegador, sin desplegar un log de miles de lineas.
            $ErrorActionPreference = "Continue"
            $cola = @(Get-Content -Path $log -ErrorAction SilentlyContinue |
              Where-Object { $_.Trim() -ne "" } |
              Select-Object -Last 12)

            # Datos de entorno ANTES del volcado, porque la primera anotacion es la que se
            # ve sin desplegar nada. El codigo de salida en hexadecimal es el que delata una
            # muerte por el sistema operativo y no un error de compilacion: `error[E...]` o
            # `ld returned 1` dejan su texto en el log, pero un proceso terminado a la fuerza
            # (0xC0000409 = STATUS_STACK_BUFFER_OVERRUN, 0xC0000017 sin memoria, ...) no
            # escribe nada y deja el log cortado en seco, que es justo lo que se observo.
            $disco = (Get-PSDrive -Name ($PWD.Drive.Name) -ErrorAction SilentlyContinue).Free
            $discoGB = if ($disco) { [double]$disco / 1GB } else { -1 }
            $ram = (Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue).FreePhysicalMemory
            $ramGB = if ($ram) { [double]$ram / 1MB } else { -1 }
            $bytes = if (Test-Path $log) { (Get-Item $log).Length } else { 0 }
            $lineasTot = @(Get-Content $log -ErrorAction SilentlyContinue).Count
            $diag = "exit={0} (0x{1:X8}) disco_libre={2:N2}GB ram_libre={3:N2}GB log={4}B lineas_log={5}" -f $code, $code, $discoGB, $ramGB, $bytes, $lineasTot
            Write-Host "::error title=diagnostico::$diag"

            # La valla del bloque de codigo es de TILDES y no de backticks a proposito. En
            # una cadena doble de PowerShell el backtick es el caracter de escape, asi que
            # escribir ``"````text"`` produce DOS backticks (`` ` ` -> '``' ``) y escribir
            # ``"`tauri build`"`` produce un TAB (`` `t ``) seguido de "auri build". Se
            # comprobo ejecutando este paso: el resumen salia con `## <TAB>auri build`.
            # Markdown acepta vallas de tilde, y aqui no hay nada que escapar.
            @("## tauri build fallo (codigo $code)", "",
              "Ultimas lineas del log de tauri-build.log:", "",
              "~~~~text") + $cola + @("~~~~") |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

            # `%25`, `%0D` y `%0A` son los escapes de los comandos de workflow: un `%` a pelo
            # rompe el formato de la anotacion. El `%` se sustituye primero, antes que los
            # otros dos, porque los escapes que estos generan contienen `%` ellos mismos.
            foreach ($linea in $cola) {
              $t = $linea -replace '%', '%25' -replace "`r", '%0D' -replace "`n", ''
              if ($t.Length -gt 900) { $t = $t.Substring(0, 900) + ' ...' }
              Write-Host "::error title=tauri build::${t}"
            }

            $ErrorActionPreference = "Stop"
            Write-Error "tauri build fallo con codigo $code. Log completo en $log (tambien como artefacto)."
            exit $code
          }

      # El log se sube siempre, y no solo en fallo: un fallo de configuracion anterior al
      # `Tee-Object` deja el fichero sin crear, y `if-no-files-found: ignore` evita que eso
      # se convierta en un segundo fallo mas molesto que el primero.
      - name: Upload Tauri build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log
          if-no-files-found: ignore

      - name: Locate and inspect NSIS artifacts
        id: artifacts
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis"
          if (-not (Test-Path $bundleDir)) {
            $bundleDir = "src-tauri/target/release/bundle/nsis"
          }
          
          $installer = Get-ChildItem -Path $bundleDir -Filter "*setup.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No se encontró el instalador NSIS (*setup.exe) en $bundleDir"
            exit 1
          }
          
          Write-Host "Instalador generado: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 2)) MB)"
          # Se emiten DOS rutas, y no es redundancia. `installer_path` es absoluta y
          # upload-artifact la resuelve contra GITHUB_WORKSPACE, que en el runner es
          # D:\a\<repo>\<repo>; fuera de ahi la interpretacion no es fiable. La relativa
          # se mide contra el workspace, que es el directorio de trabajo por defecto, y es
          # la que se usa para subir. La absoluta se queda para el paso de release, donde
          # hace falta el nombre completo del fichero.
          #
          # `Resolve-Path -Relative`, no `[System.IO.Path]::GetRelativePath`: ese metodo no
          # existe en Windows PowerShell 5.1 (.NET Framework) y solo esta en PowerShell 7+,
          # asi que con el primero el paso no depende de que `pwsh` resuelva a 5.1. `-Relative`
          # deja el prefijo `.\` que se quita aqui: el punto de la regex va escapado.
          $rel = (Resolve-Path -LiteralPath $installer.FullName -Relative) -replace '^\.[\\/]', ''
          Write-Host "Relativo al workspace: $rel"
          "installer_rel=$rel" >> $env:GITHUB_OUTPUT
          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.installer_name }}
          path: ${{ steps.artifacts.outputs.installer_rel }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifacts.outputs.installer_path }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
